spring.application.name=receitas-despensa-backend

# Conexão com o Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/receitas_de_despensa
spring.datasource.username=root
spring.datasource.password=2004

# Configurações do JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Chave secreta para assinar os tokens JWT.
jwt.secret=CHAVE_SECRETA_SUPER_LONGA_E_DIFICIL_DE_ADIVINHAR

# Credenciais da API Edamam
edamam.api.app-id=ef09f57c
edamam.api.app-key=fd94de282baf897ffb7d200e4a1b9eb1

# Define a pasta onde as imagens serão salvas
file.upload-dir=uploads/images

# Define o tamanho máximo por arquivo (ex: 10MB)
spring.servlet.multipart.max-file-size=10MB

# Define o tamanho máximo total da requisição (ex: 50MB)
spring.servlet.multipart.max-request-size=50MB